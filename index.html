<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevOps CI/CD Demo</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 80px;
        background: #f4f4f4;

        padding: 40px;

      }

  <body>
    <div class="container">
      <h1>DevOps CI/CD Automation</h1>

      <p>

      </p>

</html>
